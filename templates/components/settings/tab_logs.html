<div id="log-viewer" class="log-viewer tab-panel {% if active_tab != 'logs' %}hidden{% endif %}">
    <div class="log-header">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="color:#94a3b8;font-size:0.8rem;font-weight:600">📜 Логи FFmpeg</span>
            <span id="log-status" style="font-size:0.7rem;color:#64748b">⌛</span>
        </div>
        <div class="log-actions">
            <button id="btn-clear-logs" class="log-btn">🧹 Очистить</button>
            <button id="btn-toggle-streams" class="log-btn">📦 Свернуть</button>
        </div>
    </div>
    <div id="log-content"></div>
</div>
