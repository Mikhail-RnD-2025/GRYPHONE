{% macro status_dot(status) -%}
    <span class="dot" title="{{ status|status_text }}"></span>
    <style>.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .dot.ok{background:var(--ok);box-shadow:0 0 4px rgba(34,197,94,0.5)}
    .dot.err{background:var(--err);box-shadow:0 0 4px rgba(239,68,68,0.5)}
    .dot.disabled{background:var(--warn)}</style>
{%- endmacro %}

{% macro camera_row(cam) -%}
<div class="cam-row" data-cam-id="{{ cam.id }}">
    <div class="cam-info">
        {{ status_dot(cam.status) }}
        <span class="cam-name" title="{{ cam.name }}">{{ cam.name }}</span>
    </div>
    <div class="cam-actions">
        <span class="badge">FPS: {{ cam.fps|default('--') }}</span>
        <span class="badge">{{ cam.bitrate|default('--') }}</span>
        <button class="cam-toggle-btn btn--{{ 'off' if cam.enabled else 'on' }}"
                onclick="toggleCamDash('{{ cam.id }}', {{ cam.enabled|tojson }})">
            {{ '🔴 Отключить' if cam.enabled else '🟢 Включить' }}
        </button>
    </div>
</div>
{%- endmacro %}

{% macro progress_bar(label, value, color_class) -%}
<div class="stat-bar-card">
    <h3>{{ label }}</h3>
    <div class="stat-val">{{ value }}%</div>
    <div class="progress-bg"><div class="progress-fill {{ color_class }}" style="width: {{ value }}%"></div></div>
</div>
{%- endmacro %}
